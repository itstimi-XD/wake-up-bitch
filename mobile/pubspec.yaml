name: wake_up_bitch
description: 현실을 마주하고 일어나는 진짜 알람 앱
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  animations: ^2.0.11
  lottie: ^3.0.0

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.6.4
  injectable: ^2.3.2

  # Network
  dio: ^5.4.0
  retrofit: ^4.0.3
  json_annotation: ^4.8.1
  pretty_dio_logger: ^1.3.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Alarm & Notifications
  flutter_local_notifications: ^16.3.0
  timezone: ^0.9.2
  alarm: ^3.0.1
  android_alarm_manager_plus: ^3.0.4

  # Permissions
  permission_handler: ^11.1.0

  # Camera & Photos
  camera: ^0.10.5+7
  image_picker: ^1.0.5

  # Sensors
  sensors_plus: ^4.0.2
  pedometer: ^4.0.1
  shake: ^2.2.0

  # Location
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # QR/Barcode
  mobile_scanner: ^3.5.5
  qr_flutter: ^4.1.0

  # Audio
  audioplayers: ^5.2.1
  flutter_tts: ^3.8.3
  speech_to_text: ^6.5.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.3.0
  path_provider: ^2.1.1
  url_launcher: ^6.2.2
  package_info_plus: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  injectable_generator: ^2.4.1
  hive_generator: ^2.0.1
  json_serializable: ^6.7.1
  retrofit_generator: ^8.0.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
    - assets/fonts/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.ttf
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700
        - asset: assets/fonts/Pretendard-SemiBold.ttf
          weight: 600
